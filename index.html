<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* General Reset */
        body,
        h1,
        p,
        a {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
        }

        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
        }

        .links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .links a {
            text-decoration: none;
            padding: 10px 20px;
            font-size: 18px;
            color: white;
            background-color: #007BFF;
            border-radius: 5px;
            transition: background-color 0.3s;
            text-align: center;
            width: 100%;
            max-width: 300px;
        }

        .links a:hover {
            background-color: #0056b3;
        }

        .image-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 20px;
            }

            .links a {
                font-size: 16px;
                padding: 8px 15px;
            }

            .image-container img {
                max-width: 90%;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 18px;
            }

            .links a {
                font-size: 14px;
                padding: 6px 10px;
            }
        }
    </style>
</head>

<body>

    <!-- Links Section -->
    <div class="links">
        <a href="https://efg770.github.io/xx-770-xx.html">XX-770-XX</a>
        <a href="https://efg770.github.io/770-xx-xxx.html">770-XX-XXX</a>
    </div>

    <!-- Images Section -->
    <div class="image-container">
        <img src="images/770Lubavitch.jpg" alt="Image 1">
    </div>
</body>

</html>
